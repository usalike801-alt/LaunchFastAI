<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LaunchFast AI</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: 45px;
    color: #111827;
}

.subtitle {
    font-size: 20px;
    color: #4b5563;
}

.box {

    background: white;
    padding: 25px;
    margin: 25px auto;
    max-width: 550px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ddd;

}


input {

    padding: 12px;
    width: 85%;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;

}


button {

    background: black;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;

}


button:hover {

    opacity: 0.8;

}


#result {

    margin-top: 20px;
    line-height: 1.8;
    text-align: left;

}


</style>


</head>


<body>


<h1>🚀 LaunchFast AI</h1>

<p class="subtitle">
Your AI Toolkit To Build Faster
</p>



<div class="box">

<h2>💡 AI Business Generator</h2>

<p>
Describe your situation and get a business idea.
</p>


<input id="ideaInput" placeholder="Example: I have only a phone">


<br><br>


<button onclick="generateIdea()">
Generate Idea
</button>


<div id="result"></div>


</div>




<div class="box">

<h2>✍️ AI Content Writer</h2>

<p>
Generate content ideas and marketing text.
</p>

<button>
Coming Soon
</button>

</div>




<div class="box">

<h2>📄 AI CV Builder</h2>

<p>
Create a professional CV quickly.
</p>

<button>
Coming Soon
</button>

</div>




<script>


function generateIdea(){


let input = document.getElementById("ideaInput").value;


if(input === ""){

document.getElementById("result").innerHTML =
"Please describe your situation first.";

return;

}



document.getElementById("result").innerHTML =

"<b>🚀 Business Idea:</b><br>" +

"AI Content Service for small businesses<br><br>" +


"<b>💰 How to make money:</b><br>" +

"Offer social media posts, advertisements and designs using AI tools.<br><br>" +


"<b>📌 Starting steps:</b><br>" +

"1- Create 5 sample works.<br>" +

"2- Publish them online.<br>" +

"3- Contact potential customers.<br>" +

"4- Sell monthly packages.<br><br>" +


"<b>Your input:</b> " + input;


}


</script>



</body>

</html>
